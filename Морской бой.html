<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Морской бой</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0a1929, #1b3a5c);
    font-family: 'Segoe UI', sans-serif;
    color: #e6f1ff;
    padding: 20px;
  }
  h1 { margin: 0 0 10px; letter-spacing: 3px; text-shadow: 0 0 15px #4fc3f7; }
  .status {
    margin-bottom: 15px;
    font-size: 18px;
    min-height: 24px;
    color: #4fc3f7;
    text-shadow: 0 0 8px rgba(79,195,247,0.6);
    text-align: center;
    max-width: 700px;
  }
  .boards {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .board-wrap { text-align: center; }
  .board-wrap h2 { margin: 0 0 8px; font-size: 16px; opacity: .8; }
  .grid {
    display: grid;
    grid-template-columns: repeat(11, 34px);
    grid-template-rows: repeat(11, 34px);
    gap: 2px;
    background: rgba(0,0,0,0.3);
    padding: 6px;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(79,195,247,0.2);
  }
  .cell {
    background: #123a5c;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
    color: #9fd3ff;
  }
  .cell.label {
    background: transparent;
    cursor: default;
    font-weight: bold;
    color: #4fc3f7;
  }
  .cell:hover:not(.label):not(.hit):not(.miss):not(.sunk):not(.disabled):not(.ship) {
    background: #1e5a8a;
  }
  .cell.ship { background: #4a6a8a; }
  .cell.ship.grabbable { cursor: grab; }
  .cell.ship.grabbable:active { cursor: grabbing; }
  .cell.ship.grabbable:hover { background: #5a7a9a; }
  .cell.ship.dragging-source { opacity: 0.3; }
  .cell.preview { background: #2ecc71; }
  .cell.preview-bad { background: #c0392b; }
  .cell.hit { background: #b71c1c; }
  .cell.hit::after { content: '✕'; color: #fff; font-weight: bold; }
  .cell.miss { background: #263d52; }
  .cell.miss::after { content: '•'; color: #6a8ba8; font-size: 22px; line-height: 1; }
  .cell.sunk { background: #7f0000; }
  .cell.sunk::after { content: '✕'; color: #fff; font-weight: bold; }
  .cell.disabled { cursor: not-allowed; }

  #enemyGrid.blocked .cell:not(.label) {
    cursor: wait;
  }

  .dock {
    margin-top: 20px;
    padding: 12px 20px;
    background: rgba(0,0,0,0.35);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 60px;
    box-shadow: inset 0 0 10px rgba(79,195,247,0.15);
    transition: box-shadow .2s, background .2s;
  }
  .dock.highlight {
    background: rgba(79,195,247,0.15);
    box-shadow: inset 0 0 15px rgba(79,195,247,0.5);
  }
  .dock-label {
    font-size: 13px;
    opacity: 0.6;
    text-align: center;
    max-width: 90px;
    line-height: 1.3;
  }
  .dock-ships {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
  }
  .dock-ship {
    display: flex;
    gap: 2px;
    padding: 4px;
    border-radius: 5px;
    background: rgba(79,195,247,0.05);
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .dock-ship:hover { background: rgba(79,195,247,0.2); }
  .dock-ship.vertical { flex-direction: column; }
  .dock-ship .part {
    width: 22px; height: 22px;
    background: #4a6a8a;
    border-radius: 3px;
  }

  .controls { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
  button {
    padding: 12px 30px;
    font-size: 16px;
    background: #4fc3f7;
    color: #0a1929;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    transition: all .2s;
    box-shadow: 0 0 15px rgba(79,195,247,0.5);
  }
  button:hover:not(:disabled) { background: #81d4fa; transform: translateY(-2px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #6a8ba8; color: #0a1929; box-shadow: none; }
  button.secondary:hover:not(:disabled) { background: #8fb2cf; }

  .help {
    margin-top: 12px;
    font-size: 13px;
    opacity: 0.6;
    text-align: center;
    max-width: 700px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>МОРСКОЙ БОЙ</h1>
<div class="status" id="status">Перетащите корабли из дока. Клик по кораблю на поле — поворот</div>

<div class="boards">
  <div class="board-wrap">
    <h2>Ваш флот</h2>
    <div class="grid" id="playerGrid"></div>
  </div>
  <div class="board-wrap" id="enemyWrap" style="display:none;">
    <h2>Флот противника</h2>
    <div class="grid" id="enemyGrid"></div>
  </div>
</div>

<div class="dock" id="dock">
  <div class="dock-label">Док<br>(перетащите на поле)</div>
  <div class="dock-ships" id="dockShips"></div>
</div>

<div class="controls">
  <button id="randomBtn" class="secondary" onclick="randomPlayerPlacement()">Случайно</button>
  <button id="clearBtn" class="secondary" onclick="clearPlacement()">Очистить</button>
  <button id="startBtn" onclick="startBattle()" disabled>В бой!</button>
</div>

<div class="help">
  💡 Перетаскивание — переместить. <b>Клик по кораблю на поле</b> — поворот. <b>ЛКМ</b> — против часовой, <b>ПКМ</b> — по часовой. <b>Двойной клик по кораблю</b> — убрать в док.
</div>

<script>
const SIZE = 10;
const SHIPS = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
const LETTERS = 'АБВГДЕЖЗИК';

let playerBoard, enemyBoard;
let playerShots, enemyShots;
let gameOver;
let enemyQueue = [];
let phase = 'placement';
let enemyTurnInProgress = false;

let playerShips = [];
let drag = null;
let hoverCell = null;

// Подавляем системное контекстное меню на игровом поле и доке
document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('#playerGrid') || e.target.closest('#dock')) {
    e.preventDefault();
  }
});

function emptyBoard() {
  return Array.from({length: SIZE}, () => Array(SIZE).fill(0));
}

// ---------- Сетка ----------
function buildGrid(containerId, isEnemy) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const corner = document.createElement('div');
  corner.className = 'cell label';
  container.appendChild(corner);
  for (let i = 0; i < SIZE; i++) {
    const d = document.createElement('div');
    d.className = 'cell label';
    d.textContent = LETTERS[i];
    container.appendChild(d);
  }
  for (let r = 0; r < SIZE; r++) {
    const rowLabel = document.createElement('div');
    rowLabel.className = 'cell label';
    rowLabel.textContent = r + 1;
    container.appendChild(rowLabel);
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (isEnemy) {
        cell.addEventListener('click', () => playerShoot(r, c));
      } else {
        cell.addEventListener('pointerdown', (e) => onBoardPointerDown(e, r, c));
        cell.addEventListener('dblclick', (e) => onBoardDblClick(e, r, c));
      }
      container.appendChild(cell);
    }
  }
}

function getCell(gridId, r, c) {
  const grid = document.getElementById(gridId);
  const index = (r + 1) * (SIZE + 1) + (c + 1);
  return grid.children[index];
}

function render() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const pCell = getCell('playerGrid', r, c);
      pCell.className = 'cell';
      if (playerBoard[r][c] === 1) {
        pCell.classList.add('ship');
        if (phase === 'placement') pCell.classList.add('grabbable');
      }
      if (playerShots[r][c] === 2) pCell.classList.add('hit');
      if (playerShots[r][c] === 3) pCell.classList.add('sunk');
      if (playerShots[r][c] === 1) pCell.classList.add('miss');

      if (document.getElementById('enemyWrap').style.display !== 'none') {
        const eCell = getCell('enemyGrid', r, c);
        eCell.className = 'cell';
        if (enemyShots[r][c] === 2) eCell.classList.add('hit');
        if (enemyShots[r][c] === 3) eCell.classList.add('sunk');
        if (enemyShots[r][c] === 1) eCell.classList.add('miss');
      }
    }
  }
}

function findShipAt(r, c) {
  for (let i = 0; i < playerShips.length; i++) {
    if (playerShips[i].cells.some(([rr, cc]) => rr === r && cc === c)) return i;
  }
  return -1;
}

function canPlaceIgnoring(ignoreShipIndex, r, c, len, horiz) {
  const temp = playerBoard.map(row => row.slice());
  if (ignoreShipIndex >= 0) {
    playerShips[ignoreShipIndex].cells.forEach(([rr, cc]) => temp[rr][cc] = 0);
  }
  for (let i = 0; i < len; i++) {
    const rr = horiz ? r : r + i;
    const cc = horiz ? c + i : c;
    if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) return false;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = rr + dr, nc = cc + dc;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
          if (temp[nr][nc] === 1) return false;
        }
      }
    }
  }
  return true;
}

// ---------- Док ----------
let dockShips = [];

function renderDock() {
  const container = document.getElementById('dockShips');
  container.innerHTML = '';
  dockShips.sort((a,b) => b.len - a.len);
  dockShips.forEach((ship, idx) => {
    const el = document.createElement('div');
    el.className = 'dock-ship' + (ship.horiz ? '' : ' vertical');
    el.dataset.dockIdx = idx;
    for (let i = 0; i < ship.len; i++) {
      const p = document.createElement('div');
      p.className = 'part';
      el.appendChild(p);
    }
    el.addEventListener('pointerdown', (e) => onDockPointerDown(e, idx));
    container.appendChild(el);
  });
  updateStartButton();
}

function updateStartButton() {
  const allPlaced = dockShips.length === 0 && playerShips.length === SHIPS.length;
  document.getElementById('startBtn').disabled = !allPlaced;
}

function paintPreview(r, c, len, horiz, ignoreIndex) {
  render();
  const ok = canPlaceIgnoring(ignoreIndex, r, c, len, horiz);
  for (let i = 0; i < len; i++) {
    const rr = horiz ? r : r + i;
    const cc = horiz ? c + i : c;
    if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) continue;
    const cell = getCell('playerGrid', rr, cc);
    cell.classList.add(ok ? 'preview' : 'preview-bad');
  }
  return ok;
}

// ---------- Drag с дока ----------
function onDockPointerDown(e, dockIdx) {
  if (phase !== 'placement') return;
  if (e.button !== 0 && e.button !== 2) return;
  e.preventDefault();

  drag = {
    type: 'dock',
    dockIdx,
    ship: dockShips[dockIdx],
    startX: e.clientX,
    startY: e.clientY,
    moved: false,
    button: e.button,
    offsetR: 0,
    offsetC: 0,
    startCellR: -1,
    startCellC: -1,
  };
  document.addEventListener('pointermove', onGlobalPointerMove);
  document.addEventListener('pointerup', onGlobalPointerUp);
}

// ---------- Drag с поля ----------
function onBoardPointerDown(e, r, c) {
  if (phase !== 'placement') return;
  if (e.button !== 0 && e.button !== 2) return;

  const shipIndex = findShipAt(r, c);
  if (shipIndex < 0) return;
  e.preventDefault();

  const ship = playerShips[shipIndex];
  const [fr, fc] = ship.cells[0];

  drag = {
    type: 'board',
    shipIndex,
    ship,
    grabR: r,
    grabC: c,
    startX: e.clientX,
    startY: e.clientY,
    moved: false,
    button: e.button,
    offsetR: r - fr,
    offsetC: c - fc,
    startCellR: r,
    startCellC: c,
  };

  document.addEventListener('pointermove', onGlobalPointerMove);
  document.addEventListener('pointerup', onGlobalPointerUp);
}

function onGlobalPointerMove(e) {
  if (!drag) return;

  if (!drag.moved) {
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    if (Math.abs(dx) + Math.abs(dy) > 5) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cell = el && el.closest('#playerGrid .cell');
      const sameCell = cell && (+cell.dataset.r === drag.startCellR) && (+cell.dataset.c === drag.startCellC);
      if (!sameCell) {
        drag.moved = true;
        if (drag.type === 'board') {
          drag.ship.cells.forEach(([rr, cc]) => {
            const cellEl = getCell('playerGrid', rr, cc);
            if (cellEl) cellEl.classList.add('dragging-source');
          });
        } else {
          document.getElementById('dock').classList.add('highlight');
        }
      }
    }
  }

  if (!drag.moved) return;

  const el = document.elementFromPoint(e.clientX, e.clientY);
  let overDock = false;
  let cellR = -1, cellC = -1;

  if (el) {
    if (el.closest('#dock')) overDock = true;
    const cell = el.closest('#playerGrid .cell');
    if (cell && cell.dataset.r !== undefined) {
      cellR = +cell.dataset.r;
      cellC = +cell.dataset.c;
    }
  }

  document.getElementById('dock').classList.toggle('highlight', !!overDock);

  if (cellR >= 0 && cellC >= 0) {
    const offR = drag.type === 'board' ? drag.offsetR : 0;
    const offC = drag.type === 'board' ? drag.offsetC : 0;
    let r = cellR - offR;
    let c = cellC - offC;
    const ship = drag.ship;
    const len = ship.len || ship.cells.length;

    if (ship.horiz) {
      if (c + len > SIZE) c = SIZE - len;
      if (c < 0) c = 0;
      if (r < 0) r = 0;
      if (r >= SIZE) r = SIZE - 1;
    } else {
      if (r + len > SIZE) r = SIZE - len;
      if (r < 0) r = 0;
      if (c < 0) c = 0;
      if (c >= SIZE) c = SIZE - 1;
    }

    const ignoreIndex = drag.type === 'board' ? drag.shipIndex : -1;
    paintPreview(r, c, len, ship.horiz, ignoreIndex);
    hoverCell = {r, c};
  } else {
    hoverCell = null;
    render();
    if (drag.type === 'board') {
      drag.ship.cells.forEach(([rr, cc]) => {
        const cellEl = getCell('playerGrid', rr, cc);
        if (cellEl) cellEl.classList.add('dragging-source');
      });
    }
  }
}

function onGlobalPointerUp(e) {
  document.removeEventListener('pointermove', onGlobalPointerMove);
  document.removeEventListener('pointerup', onGlobalPointerUp);
  if (!drag) return;

  const wasDrag = drag.moved;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const overDock = el && el.closest('#dock');

  document.getElementById('dock').classList.remove('highlight');
  if (drag.type === 'board') {
    drag.ship.cells.forEach(([rr, cc]) => {
      const cellEl = getCell('playerGrid', rr, cc);
      if (cellEl) cellEl.classList.remove('dragging-source');
    });
  }

  if (!wasDrag) {
    // Клик — поворот.
    // ЛКМ (button 0) — ПРОТИВ часовой. ПКМ (button 2) — ПО часовой.
    const clockwise = (drag.button === 2);
    if (drag.type === 'dock') {
      drag.ship.horiz = !drag.ship.horiz;
      renderDock();
      setStatus('Поворот корабля в доке');
    } else {
      const ok = rotateShipAroundCell(drag.shipIndex, drag.grabR, drag.grabC, clockwise);
      if (ok) {
        setStatus(clockwise ? 'Поворот по часовой' : 'Поворот против часовой');
      } else {
        setStatus('Повернуть нельзя — мешает другой корабль или край поля');
      }
      render();
    }
    drag = null;
    hoverCell = null;
    return;
  }

  // Был drag
  if (overDock) {
    if (drag.type === 'board') {
      drag.ship.cells.forEach(([rr, cc]) => playerBoard[rr][cc] = 0);
      playerShips.splice(drag.shipIndex, 1);
      dockShips.push({len: drag.ship.cells.length, horiz: drag.ship.horiz});
      rebuildDock();
    }
  } else if (hoverCell) {
    const ship = drag.ship;
    const len = ship.len || ship.cells.length;
    const ignoreIndex = drag.type === 'board' ? drag.shipIndex : -1;
    const ok = canPlaceIgnoring(ignoreIndex, hoverCell.r, hoverCell.c, len, ship.horiz);

    if (ok) {
      if (drag.type === 'board') {
        ship.cells.forEach(([rr, cc]) => playerBoard[rr][cc] = 0);
        playerShips.splice(drag.shipIndex, 1);
      } else {
        dockShips.splice(drag.dockIdx, 1);
      }
      const newCells = [];
      for (let i = 0; i < len; i++) {
        const rr = ship.horiz ? hoverCell.r : hoverCell.r + i;
        const cc = ship.horiz ? hoverCell.c + i : hoverCell.c;
        playerBoard[rr][cc] = 1;
        newCells.push([rr, cc]);
      }
      newCells.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      playerShips.push({cells: newCells, horiz: ship.horiz});
      if (drag.type === 'dock') renderDock();
    }
  }

  drag = null;
  hoverCell = null;
  render();
  rebuildDock();
}

// ---------- Двойной клик — убрать корабль в док ----------
function onBoardDblClick(e, r, c) {
  if (phase !== 'placement') return;
  e.preventDefault();
  const shipIndex = findShipAt(r, c);
  if (shipIndex < 0) return;
  const ship = playerShips[shipIndex];
  ship.cells.forEach(([rr, cc]) => playerBoard[rr][cc] = 0);
  playerShips.splice(shipIndex, 1);
  dockShips.push({len: ship.cells.length, horiz: ship.horiz});
  render();
  rebuildDock();
  setStatus('Корабль возвращён в док');
}

// ---------- Поворот вокруг указанной клетки ----------
function rotateShipAroundCell(shipIndex, anchorR, anchorC, clockwise) {
  const ship = playerShips[shipIndex];
  const len = ship.cells.length;
  if (len === 1) return false;

  const anchorIdx = ship.cells.findIndex(([r, c]) => r === anchorR && c === anchorC);
  if (anchorIdx < 0) return false;

  // Сначала в указанную сторону, потом в противоположную
  if (tryRotate(ship, anchorIdx, len, clockwise)) return true;
  if (tryRotate(ship, anchorIdx, len, !clockwise)) return true;
  return false;
}

function tryRotate(ship, anchorIdx, len, clockwise) {
  const anchorCell = ship.cells[anchorIdx];
  const anchorR = anchorCell[0];
  const anchorC = anchorCell[1];

  let newHoriz;
  const cells = [];

  if (ship.horiz) {
    newHoriz = false;
    for (let i = 0; i < len; i++) {
      const dr = clockwise ? (anchorIdx - i) : (i - anchorIdx);
      cells.push([anchorR + dr, anchorC]);
    }
  } else {
    newHoriz = true;
    for (let i = 0; i < len; i++) {
      const dc = clockwise ? (i - anchorIdx) : (anchorIdx - i);
      cells.push([anchorR, anchorC + dc]);
    }
  }

  for (const [r, c] of cells) {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
  }

  const temp = playerBoard.map(row => row.slice());
  ship.cells.forEach(([rr, cc]) => temp[rr][cc] = 0);

  for (const [r, c] of cells) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
          if (temp[nr][nc] === 1) return false;
        }
      }
    }
  }

  // Применяем
  ship.cells.forEach(([rr, cc]) => playerBoard[rr][cc] = 0);
  const newCells = cells.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  newCells.forEach(([rr, cc]) => playerBoard[rr][cc] = 1);
  ship.cells = newCells;
  ship.horiz = newHoriz;
  return true;
}

// ---------- Случайная расстановка ----------
function canPlaceRaw(board, r, c, len, horiz) {
  for (let i = 0; i < len; i++) {
    const rr = horiz ? r : r + i;
    const cc = horiz ? c + i : c;
    if (rr >= SIZE || cc >= SIZE) return false;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = rr + dr, nc = cc + dc;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
          if (board[nr][nc] === 1) return false;
        }
      }
    }
  }
  return true;
}

function randomPlacement(board) {
  for (const len of SHIPS) {
    let placed = false, attempts = 0;
    while (!placed && attempts < 2000) {
      attempts++;
      const h = Math.random() < 0.5;
      const r = Math.floor(Math.random() * SIZE);
      const c = Math.floor(Math.random() * SIZE);
      if (canPlaceRaw(board, r, c, len, h)) {
        for (let i = 0; i < len; i++) {
          const rr = h ? r : r + i;
          const cc = h ? c + i : c;
          board[rr][cc] = 1;
        }
        placed = true;
      }
    }
    if (!placed) return randomPlacement(board);
  }
}

function rebuildDock() {
  const placed = {};
  playerShips.forEach(s => {
    const l = s.cells.length;
    placed[l] = (placed[l] || 0) + 1;
  });
  const need = {};
  SHIPS.forEach(l => need[l] = (need[l] || 0) + 1);

  const oldDock = dockShips.slice();
  const newDock = [];
  const sorted = [...new Set(SHIPS)].sort((a,b) => b - a);
  for (const len of sorted) {
    const needCount = need[len];
    const placedCount = placed[len] || 0;
    const dockCount = needCount - placedCount;
    const oldOfLen = oldDock.filter(d => d.len === len);
    for (let i = 0; i < dockCount; i++) {
      if (oldOfLen[i]) newDock.push(oldOfLen[i]);
      else newDock.push({len, horiz: true});
    }
  }
  dockShips = newDock;
  renderDock();
}

function randomPlayerPlacement() {
  if (phase !== 'placement') return;
  playerBoard = emptyBoard();
  randomPlacement(playerBoard);
  playerShips = [];
  const visited = emptyBoard();
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (playerBoard[r][c] === 1 && !visited[r][c]) {
        const stack = [[r, c]];
        const cells = [];
        while (stack.length) {
          const [cr, cc] = stack.pop();
          if (cr < 0 || cr >= SIZE || cc < 0 || cc >= SIZE) continue;
          if (visited[cr][cc]) continue;
          if (playerBoard[cr][cc] !== 1) continue;
          visited[cr][cc] = 1;
          cells.push([cr, cc]);
          stack.push([cr+1,cc],[cr-1,cc],[cr,cc+1],[cr,cc-1]);
        }
        cells.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        const horiz = cells.length === 1 || (cells[0][0] === cells[1][0]);
        playerShips.push({cells, horiz});
      }
    }
  }
  dockShips = [];
  render();
  renderDock();
  setStatus('Флот расставлен случайно');
}

function clearPlacement() {
  if (phase !== 'placement') return;
  playerBoard = emptyBoard();
  playerShips = [];
  dockShips = SHIPS.map(len => ({len, horiz: true}));
  render();
  renderDock();
  setStatus('Перетащите корабли из дока на поле');
}

// ---------- Начало боя ----------
function startBattle() {
  if (dockShips.length > 0 || playerShips.length !== SHIPS.length) return;

  enemyBoard = emptyBoard();
  randomPlacement(enemyBoard);
  playerShots = emptyBoard();
  enemyShots = emptyBoard();
  gameOver = false;
  enemyQueue = [];
  enemyTurnInProgress = false;
  phase = 'battle';

  document.getElementById('enemyWrap').style.display = '';
  document.getElementById('dock').style.display = 'none';
  document.getElementById('randomBtn').style.display = 'none';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  document.querySelector('.help').style.display = 'none';

  buildGrid('playerGrid', false);
  buildGrid('enemyGrid', true);
  render();
  setStatus('Ваш ход! Стреляйте по полю противника');
}

// ---------- Потопление ----------
function checkSunk(board, shots, r, c) {
  const visited = new Set();
  const stack = [[r, c]];
  const shipCells = [];
  while (stack.length) {
    const [cr, cc] = stack.pop();
    const key = cr + ',' + cc;
    if (visited.has(key)) continue;
    visited.add(key);
    if (board[cr][cc] !== 1) continue;
    shipCells.push([cr, cc]);
    for (const [dr, dc] of [[0,1],[0,-1],[1,0],[-1,0]]) {
      const nr = cr + dr, nc = cc + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !visited.has(nr+','+nc)) {
        stack.push([nr, nc]);
      }
    }
  }
  const allHit = shipCells.every(([rr, cc]) => shots[rr][cc] === 2 || shots[rr][cc] === 3);
  if (allHit) {
    shipCells.forEach(([rr, cc]) => shots[rr][cc] = 3);
    shipCells.forEach(([rr, cc]) => {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = rr + dr, nc = cc + dc;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && shots[nr][nc] === 0) {
            shots[nr][nc] = 1;
          }
        }
      }
    });
  }
  return allHit;
}

function allSunk(board, shots) {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c] === 1 && shots[r][c] !== 3) return false;
  return true;
}

// ---------- Ход игрока ----------
function playerShoot(r, c) {
  if (phase !== 'battle' || gameOver) return;
  if (enemyTurnInProgress) return;
  if (enemyShots[r][c] !== 0) return;

  if (enemyBoard[r][c] === 1) {
    enemyShots[r][c] = 2;
    checkSunk(enemyBoard, enemyShots, r, c);
    setStatus('Попадание! Стреляйте ещё');
  } else {
    enemyShots[r][c] = 1;
    setStatus('Промах! Ход противника...');
  }
  render();

  if (allSunk(enemyBoard, enemyShots)) {
    setStatus('🎉 Вы победили! Весь флот противника уничтожен!');
    gameOver = true;
    phase = 'over';
    return;
  }

  if (enemyShots[r][c] === 2 || enemyShots[r][c] === 3) return;

  enemyTurnInProgress = true;
  document.getElementById('enemyGrid').classList.add('blocked');
  setTimeout(enemyTurn, 700);
}

// ---------- Ход компьютера ----------
function enemyTurn() {
  if (gameOver || phase !== 'battle') {
    enemyTurnInProgress = false;
    document.getElementById('enemyGrid').classList.remove('blocked');
    return;
  }

  let r, c;
  if (enemyQueue.length > 0) {
    [r, c] = enemyQueue.shift();
    if (playerShots[r][c] !== 0) return enemyTurn();
  } else {
    let tries = 0;
    do {
      r = Math.floor(Math.random() * SIZE);
      c = Math.floor(Math.random() * SIZE);
      tries++;
    } while (playerShots[r][c] !== 0 && tries < 200);
    if (playerShots[r][c] !== 0) return;
  }

  if (playerBoard[r][c] === 1) {
    playerShots[r][c] = 2;
    const sunk = checkSunk(playerBoard, playerShots, r, c);
    render();

    if (sunk) {
      enemyQueue = [];
      setStatus('Противник потопил ваш корабль!');
    } else {
      setStatus('Противник попал!');
      for (const [dr, dc] of [[0,1],[0,-1],[1,0],[-1,0]]) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && playerShots[nr][nc] === 0) {
          enemyQueue.push([nr, nc]);
        }
      }
    }

    if (allSunk(playerBoard, playerShots)) {
      setStatus('💀 Противник потопил весь ваш флот! Вы проиграли.');
      gameOver = true;
      phase = 'over';
      enemyTurnInProgress = false;
      document.getElementById('enemyGrid').classList.remove('blocked');
      return;
    }
    setTimeout(enemyTurn, 700);
  } else {
    playerShots[r][c] = 1;
    render();
    setStatus('Противник промахнулся. Ваш ход!');
    enemyTurnInProgress = false;
    document.getElementById('enemyGrid').classList.remove('blocked');
  }
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

// ---------- Инициализация ----------
function init() {
  playerBoard = emptyBoard();
  enemyBoard = emptyBoard();
  playerShots = emptyBoard();
  enemyShots = emptyBoard();
  playerShips = [];
  gameOver = false;
  phase = 'placement';
  enemyTurnInProgress = false;

  dockShips = SHIPS.map(len => ({len, horiz: true}));

  buildGrid('playerGrid', false);
  document.getElementById('enemyWrap').style.display = 'none';
  document.getElementById('dock').style.display = '';
  document.getElementById('randomBtn').style.display = '';
  document.getElementById('clearBtn').style.display = '';
  document.getElementById('startBtn').style.display = '';
  document.querySelector('.help').style.display = '';

  render();
  renderDock();
  setStatus('Перетащите корабли из дока на поле. Клик по кораблю на поле — поворот');
}

init();
</script>
